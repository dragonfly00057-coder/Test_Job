services:
  postgres:
    image: postgres:17-alpine
    container_name: matinaljob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matinaljob}
      POSTGRES_USER: ${POSTGRES_USER:-matinaljob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD dans le fichier .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - matinaljob_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matinaljob} -d ${POSTGRES_DB:-matinaljob}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  matinaljob_postgres_data:
